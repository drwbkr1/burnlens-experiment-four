name: repository-controls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository controls
        run: python scripts/validate_repository.py
      - name: Validate prior-event exclusions
        run: python scripts/validate_prior_event_exclusions.py
      - name: Validate metadata protocol
        run: python scripts/validate_metadata_protocol.py
      - name: Validate source review checkpoint
        run: python scripts/validate_source_review.py
      - name: Validate source adoption checkpoint
        run: python scripts/validate_source_adoption.py
      - name: Run focused tests
        run: python -m unittest discover -s tests -v
